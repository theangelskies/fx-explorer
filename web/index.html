<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Exchange rates, long-range trends and rate alerts" />
    <title>fx-explorer</title>
    <script>
      // Apply the theme before the first paint, so dark mode doesn't flash white.
      // Saved choice wins; otherwise follow the system. Storage can be blocked: then just use the system.
      (function () {
        var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        try {
          var saved = localStorage.getItem("fx-theme");
          if (saved === "dark" || saved === "light") dark = saved === "dark";
        } catch (e) {}
        if (dark) document.documentElement.classList.add("dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
