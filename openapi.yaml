    ProblemBadRequest:
      summary: '`from` is after `to`'
      value:
        type: /problems/invalid-parameters
        title: Invalid query or path parameters
        status: 400
        detail: 1 parameter is invalid.
        instance: /v1/rates
        errors:
          - field: from
            message: Must be on or before `to` (2026-11-01).

    ProblemNotFound:
      summary: Unknown currency
      value:
        type: /problems/not-found
        title: Resource not found
        status: 404
        detail: No currency with code 'XYZ'.
        instance: /v1/currencies/XYZ

    ProblemValidation:
      summary: Invalid alert body
      value:
        type: /problems/validation-error
        title: Request body is invalid
        status: 422
        detail: 2 fields are invalid.
        instance: /v1/alerts
        errors:
          - field: quote
            message: Must be different from base.
          - field: threshold
            message: Must be a number greater than 0 with at most 10 decimal places.

    ProblemIdempotencyReused:
      summary: Same Idempotency-Key, different body
      value:
        type: /problems/idempotency-key-reused
        title: Idempotency key reused with a different request
        status: 422
        detail: This Idempotency-Key was already used with a different request body. Use a new key for a new request.
        instance: /v1/alerts

    ProblemIdempotencyInUse:
      summary: First request with this key is still running
      value:
        type: /problems/idempotency-key-in-use
        title: Request with this idempotency key is in progress
        status: 409
        detail: A request with this Idempotency-Key is still being processed. Retry in a moment.
        instance: /v1/alerts

    ProblemInternal:
      summary: Unexpected error
      value:
        type: /problems/internal-error
        title: Internal server error
        status: 500
        detail: Something went wrong on our side. Please try again later.
        instance: /v1/rates

    ProblemUnavailable:
      summary: Database down
      value:
        type: /problems/service-unavailable
        title: Service unavailable
        status: 503
        detail: The database cannot be reached.
        instance: /v1/health
